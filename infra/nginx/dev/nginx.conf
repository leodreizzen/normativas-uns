# Resolve upstreams at request time so nginx starts even if they are not up yet
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8080;
  http2 on;

  location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        rewrite ^/assets/([^/]+)/(.*) /$2 break;

        set $garage_upstream http://garage:3902;
        proxy_pass $garage_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /s3-api/ {
        rewrite ^/s3-api/(.*) /$1 break;
        set $s3_upstream ${S3_ENDPOINT};
        proxy_pass $s3_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $1;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;


        client_max_body_size 20M;
    }
}